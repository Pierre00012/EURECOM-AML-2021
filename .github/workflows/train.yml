
name: Glaucoma Classification - Kaggle Training

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  train:
    name: Run Kaggle Notebook
    runs-on: ubuntu-latest

    steps:

      # 1. Récupération du dépôt GitHub
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Installation de Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Installation de Kaggle CLI
      - name: Install Kaggle CLI
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install six
          python -m pip install --no-cache-dir --force-reinstall kaggle

          python -c "import six; print('six installed:', six.__version__)"
          kaggle --version

      
      # 4. Configuration du token Kaggle
      - name: Configure Kaggle authentication
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "KAGGLE_API_TOKEN is missing"
            exit 1
          fi
          echo "Kaggle token configured"

      # 5. Vérification de l'authentification
      - name: Verify Kaggle authentication
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          kaggle competitions list

      # 6. Envoi et lancement du notebook
      - name: Submit notebook to Kaggle
        env:
          GIT_SHA: ${{ github.sha }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          python kaggle_kernel/runner.py

